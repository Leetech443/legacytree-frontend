<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LegacyTree RSVP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.inp{width:100%;padding:.65rem .75rem;border:1px solid #cbd5e1;border-radius:.6rem;font-size:.85rem;background:#fff}
.inp:focus{outline:2px solid #16a34a;border-color:#16a34a}.lbl{display:block;font-size:.75rem;font-weight:600;color:#334155;margin-bottom:.3rem}
.opt{font-weight:400;color:#64748b}.err{color:#dc2626;font-size:.72rem;margin-top:.2rem}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<header class="bg-slate-900 text-white sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
    <b class="tracking-tight">LegacyTree RSVP</b>
    <nav id="nav" class="flex gap-1 text-xs font-semibold overflow-x-auto"></nav>
  </div>
</header>
<main class="max-w-3xl mx-auto p-4 sm:p-6"><div id="view"></div></main>
<div id="toast" class="hidden fixed bottom-5 right-5 max-w-sm bg-slate-900 text-white text-sm p-4 rounded-xl shadow-2xl z-50"></div>

<script src="config.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let OPTIONS = { travel_methods: [], decline_reasons: [] };
const API_BASE = (window.APP_CONFIG?.API_BASE || '').replace(/\/$/, '');
let adminToken = sessionStorage.getItem('adminToken') || '';

async function api(path, { method = 'GET', body, raw } = {}) {
  const res = await fetch(API_BASE + '/api' + path, {
    method, headers: { 'Content-Type': 'application/json', ...(adminToken ? { Authorization: 'Bearer ' + adminToken } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (raw && res.ok) return res;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.details = data.details; e.status = res.status; throw e; }
  return data;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.background = bad ? '#991b1b' : '#0f172a'; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 4000); }
const today = () => new Date().toISOString().slice(0, 10);
const tomorrow = () => new Date(Date.now() + 864e5).toISOString().slice(0, 10);

/* ---------- field helpers ---------- */
const F = (name, label, { type = 'text', req = true, hint = '', attrs = '', cls = '' } = {}) =>
  `<div class="${cls}"><label class="lbl">${label}${req ? ' *' : ` <span class="opt">(Optional${hint ? ' – ' + hint : ''})</span>`}</label>
   <input class="inp" name="${name}" type="${type}" ${req ? 'required' : ''} ${attrs} /></div>`;
const S = (name, label, options, { req = true, ph = 'Select option', cls = '', attrs = '' } = {}) =>
  `<div class="${cls}"><label class="lbl">${label}${req ? ' *' : ''}</label><select class="inp" name="${name}" ${req ? 'required' : ''} ${attrs}>
   <option value="">${ph}</option>${options.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></div>`;
const T = (name, label) => `<div><label class="lbl">${label} <span class="opt">(Optional)</span></label><textarea class="inp" rows="2" name="${name}" maxlength="1000"></textarea></div>`;
const YN = (name, label, color = 'green') => `<div class="p-4 rounded-xl bg-green-50 border border-green-100"><label class="lbl">${label} *</label>
  <div class="flex gap-6 text-sm font-medium"><label><input type="radio" name="${name}" value="true" required> Yes</label><label><input type="radio" name="${name}" value="false"> No</label></div></div>`;

/* ---------- RSVP block shared by all three forms ---------- */
function rsvpBlock() {
  const travel = OPTIONS.travel_methods.map((t) => [t.code, t.label]);
  const reasons = OPTIONS.decline_reasons.map((t) => [t.code, t.label]);
  return `<div class="border-t border-slate-200 pt-5 space-y-4">
    ${S('status', 'Will you attend?', [['YES', 'Yes, I will attend'], ['MAYBE', "I'm not sure yet"], ['NO', "No, I can't make it"]], { ph: 'Select answer' })}
    <div data-panel="YES" class="hidden space-y-4">
      ${F('companions_count', 'Number of people attending with you', { type: 'number', req: false, hint: 'enter 0 if coming alone', attrs: 'min="0" max="50" value="0"' })}
      <div class="grid sm:grid-cols-2 gap-4">
        ${F('arrival_date', 'Expected Arrival Date', { type: 'date', attrs: `min="${today()}"` })}
        ${F('departure_date', 'Expected Departure Date', { type: 'date', attrs: `min="${today()}"` })}
        ${S('travel_method', 'How will you travel?', travel, { ph: 'Select Travel Method' })}
        ${S('needs_accommodation', 'Will you require accommodation?', [['true', 'Yes'], ['false', 'No']])}
      </div>
      ${T('dietary_notes', 'Any dietary requirements / allergies?')}
      ${T('additional_info', 'Additional Information or Requests')}
    </div>
    <div data-panel="MAYBE" class="hidden p-4 rounded-xl bg-amber-50 border border-amber-200 space-y-2">
      <p class="text-sm text-amber-900">No problem. On which day should we ask you again?</p>
      ${F('followup_date', 'Remind me on', { type: 'date', attrs: `min="${tomorrow()}"` })}
    </div>
    <div data-panel="NO" class="hidden p-4 rounded-xl bg-slate-100 border border-slate-200 space-y-3">
      <p class="text-sm text-slate-700">Sorry you can't make it. Could you tell us why?</p>
      ${S('reason_code', 'Main reason', reasons)}
      <div><label class="lbl">Tell us more <span class="opt" data-other-hint>(Optional)</span></label><textarea class="inp" rows="2" name="reason_text" maxlength="1000"></textarea></div>
    </div>
  </div>`;
}
function bindRsvp(form) {
  const sync = () => {
    const v = form.status.value;
    form.querySelectorAll('[data-panel]').forEach((p) => {
      const on = p.dataset.panel === v;
      p.classList.toggle('hidden', !on);
      p.querySelectorAll('input,select,textarea').forEach((el) => { el.disabled = !on; });
      // required only while visible (browser validation)
      p.querySelectorAll('[data-req]').forEach((el) => { el.required = on; });
    });
    const need = { YES: ['arrival_date', 'arrival_time', 'departure_date', 'travel_method', 'needs_accommodation'], MAYBE: ['followup_date'], NO: ['reason_code'] }[v] || [];
    form.querySelectorAll('[data-panel] [name]').forEach((el) => { el.required = need.includes(el.name); });
  };
  form.status.addEventListener('change', sync); sync();
  form.reason_code?.addEventListener('change', () => { form.reason_text.required = form.reason_code.value === 'OTHER'; });
}

/* ---------- Form definitions ---------- */
const GEN = {
  CHILD: { tab: 'Children', badge: 'Form 1 · Generation 2', title: 'Direct Children RSVP', sub: 'For sons and daughters of registered family matriarchs.',
    fields: () => `${S('parent_id', 'Select Mum (registered mother)', [], { attrs: 'id="parent"' })}
      <div class="grid sm:grid-cols-2 gap-4">${F('full_name', 'Full Name')}${S('gender', 'Gender', [['Female', 'Female'], ['Male', 'Male']])}
      ${F('email', 'Email Address', { type: 'email' })}${F('phone', 'Phone / WhatsApp', { type: 'tel' })}</div>
      ${YN('has_children', 'Do you have children?')}` },
  GRANDCHILD: { tab: 'Grandchildren', badge: 'Form 2 · Generation 3', title: 'Grandchildren RSVP', sub: 'Choose which parent you descend from.',
    fields: () => `<div class="grid sm:grid-cols-2 gap-4">${S('lineage_side', 'Lineage side', [['Maternal', "Mother's side"], ['Paternal', "Father's side"]])}
      ${S('parent_gender', 'Parent is my', [['Female', 'Mother'], ['Male', 'Father']], { attrs: 'id="pgender"' })}</div>
      ${S('parent_id', 'Select parent', [], { attrs: 'id="parent"' })}
      <div class="grid sm:grid-cols-2 gap-4">${F('full_name', 'Full Name')}${S('gender', 'Gender', [['Female', 'Female'], ['Male', 'Male']])}
      ${F('age', 'Age', { type: 'number', attrs: 'min="0" max="100"' })}${F('school', 'School / Occupation', { req: false })}
      ${F('email', 'Email', { type: 'email', req: false })}${F('phone', 'Phone', { type: 'tel', req: false })}</div>
      ${YN('has_children', 'Do you have children?')}` },
  GREAT_GRANDCHILD: { tab: 'Great-Grandchildren', badge: 'Form 3 · Generation 4', title: 'Great-Grandchildren RSVP', sub: 'A parent or guardian should complete this form.',
    fields: () => `${S('lineage_side', 'Lineage side', [['Maternal', "Mother's side"], ['Paternal', "Father's side"]])}
      ${S('parent_id', 'Select parent (Generation 3)', [], { attrs: 'id="parent"' })}
      <div class="grid sm:grid-cols-2 gap-4">${F('full_name', 'Child Full Name')}${S('gender', 'Gender', [['Female', 'Female'], ['Male', 'Male']])}
      ${F('age', 'Age', { type: 'number', attrs: 'min="0" max="25"' })}<span></span>
      ${F('guardian_name', 'Guardian Name')}${F('guardian_phone', 'Guardian Phone', { type: 'tel' })}</div>` },
};

async function loadParents(gen, form) {
  const sel = form.parent_id, g = form.parent_gender?.value || (gen === 'CHILD' ? 'Female' : '');
  if (gen === 'GRANDCHILD' && !g) { sel.innerHTML = '<option value="">Select parent type first</option>'; return; }
  const list = await api(`/parents?for=${gen}&gender=${g}`);
  sel.innerHTML = `<option value="">${list.length ? 'Select parent' : 'No registered parents yet'}</option>` +
    list.map((p) => `<option value="${p.id}">${esc(p.full_name)}${gen === 'GRANDCHILD' ? ` (${p.generation === 'PARENT' ? 'Parent' : 'Child'})` : ''}</option>`).join('');
}

function buildPayload(gen, form) {
  const v = Object.fromEntries(new FormData(form));
  const bool = (x) => x === 'true';
  const member = { generation: gen, full_name: v.full_name, gender: v.gender, parent_id: v.parent_id,
    lineage_side: v.lineage_side || undefined, has_children: bool(v.has_children), email: v.email || '', phone: v.phone, age: v.age || undefined,
    school: v.school, guardian_name: v.guardian_name, guardian_phone: v.guardian_phone };
  const rsvp = { status: v.status };
  if (v.status === 'YES') rsvp.attendance = { companions_count: v.companions_count || 0, arrival_date: v.arrival_date, arrival_time: v.arrival_time,
    departure_date: v.departure_date, travel_method: v.travel_method, needs_accommodation: bool(v.needs_accommodation),
    dietary_notes: v.dietary_notes, special_assistance: v.special_assistance, additional_info: v.additional_info };
  if (v.status === 'MAYBE') rsvp.followup_date = v.followup_date;
  if (v.status === 'NO') rsvp.decline = { reason_code: v.reason_code, reason_text: v.reason_text };
  return { member, rsvp, consent: form.consent.checked };
}

function renderForm(gen) {
  const g = GEN[gen];
  $('#view').innerHTML = `<div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-5">
    <div><span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">${g.badge}</span>
    <h2 class="text-2xl font-bold mt-2">${g.title}</h2><p class="text-xs text-slate-500">${g.sub}</p></div>
    <form id="f" class="space-y-5" novalidate>${g.fields()}${rsvpBlock()}
      <label class="flex gap-2 text-xs text-slate-600"><input type="checkbox" name="consent" required class="mt-0.5"> I confirm the details are correct and agree they may be stored to organise this event.</label>
      <p id="formerr" class="err"></p>
      <button class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-sm">Submit RSVP</button>
    </form></div>`;
  const form = $('#f'); bindRsvp(form);
  loadParents(gen, form).catch((e) => toast(e.message, true));
  form.parent_gender?.addEventListener('change', () => loadParents(gen, form));
  form.reason_code?.addEventListener('change', () => { $('[data-other-hint]', form).textContent = form.reason_code.value === 'OTHER' ? '(Required)' : '(Optional)'; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); $('#formerr').textContent = '';
    if (!form.reportValidity()) return;
    const btn = form.querySelector('button'); btn.disabled = true;
    try {
      const out = buildPayload(gen, form);
      const status = out.rsvp.status;
      await api('/register', { method: 'POST', body: out });
      $('#view').innerHTML = `<div class="bg-white rounded-2xl p-10 text-center shadow-sm border border-slate-200 space-y-2">
        <h2 class="text-2xl font-bold">Thank you!</h2><p class="text-slate-600 text-sm">${{
          YES: 'Your attendance details are saved. We look forward to seeing you.',
          MAYBE: 'We will ask you again on the day you chose.', NO: "We're sorry you can't make it, and thank you for letting us know." }[status]}</p>
        <button class="mt-4 px-4 py-2 bg-green-600 text-white rounded-lg text-sm" onclick="renderForm('${gen}')">Register another person</button></div>`;
    } catch (err) {
      $('#formerr').textContent = (err.details ? err.details.map((d) => `${d.field}: ${d.message}`).join(' · ') : err.message);
      btn.disabled = false;
    }
  });
}

/* ---------- Admin ---------- */
function renderAdminLogin() {
  $('#view').innerHTML = `<form id="lf" class="max-w-sm mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-4">
    <h2 class="text-xl font-bold">Admin sign in</h2>${F('username', 'Username', { attrs: 'autocomplete="username"' })}${F('password', 'Password', { type: 'password', attrs: 'autocomplete="current-password"' })}
    <p id="lerr" class="err"></p><button class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-sm">Sign in</button></form>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    try { const r = await api('/admin/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
      adminToken = r.token; sessionStorage.setItem('adminToken', adminToken); renderAdmin(); }
    catch (err) { $('#lerr').textContent = err.message; }
  };
}
const badge = (s) => `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${{ YES: 'bg-green-100 text-green-700', NO: 'bg-red-100 text-red-700', MAYBE: 'bg-amber-100 text-amber-700' }[s] || 'bg-slate-100 text-slate-500'}">${s || 'NONE'}</span>`;

async function renderAdmin(filter = {}) {
  if (!adminToken) return renderAdminLogin();
  try {
    const q = new URLSearchParams(filter).toString();
    const [stats, rows, fu] = await Promise.all([api('/admin/stats'), api('/admin/members?' + q), api('/admin/followups')]);
    const tot = (s) => stats.filter((x) => x.status === s).reduce((a, x) => a + x.n, 0);
    const heads = stats.filter((x) => x.status === 'YES').reduce((a, x) => a + x.n + x.companions, 0);
    $('#view').innerHTML = `<div class="space-y-6">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${[['Attending', tot('YES'), 'text-green-600'], ['Maybe', tot('MAYBE'), 'text-amber-600'], ['Declined', tot('NO'), 'text-red-600'], ['Expected headcount', heads, 'text-slate-900']]
        .map(([l, n, c]) => `<div class="bg-white p-4 rounded-xl border border-slate-200"><div class="text-xs text-slate-500">${l}</div><div class="text-2xl font-extrabold ${c}">${n}</div></div>`).join('')}</div>
      <div class="bg-white rounded-xl border border-slate-200 p-4"><h3 class="font-bold text-sm mb-2">Follow-ups (${fu.length} pending)</h3>
        ${fu.length ? fu.map((f) => `<div class="flex justify-between items-center text-xs py-1.5 border-t"><span><b>${esc(f.full_name)}</b> · ${esc(f.phone || f.email || '')} · ask on ${f.remind_on.slice(0, 10)} ${f.due ? '<b class="text-red-600">DUE</b>' : ''}</span>
        <button class="text-green-700 font-semibold" data-done="${f.id}">Mark done</button></div>`).join('') : '<p class="text-xs text-slate-500">None.</p>'}</div>
      <div class="flex flex-wrap gap-2 items-center">
        <select id="fg" class="inp w-auto"><option value="">All generations</option>${Object.keys(GEN).concat('PARENT').map((g) => `<option ${filter.generation === g ? 'selected' : ''}>${g}</option>`).join('')}</select>
        <select id="fs" class="inp w-auto"><option value="">All statuses</option>${['YES', 'MAYBE', 'NO'].map((g) => `<option ${filter.status === g ? 'selected' : ''}>${g}</option>`).join('')}</select>
        <button id="exp" class="ml-auto px-3 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold">Export CSV</button>
        <button id="addp" class="px-3 py-2 bg-green-600 text-white rounded-lg text-xs font-semibold">+ Root parent</button></div>
      <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500 text-left"><tr>
        <th class="p-3">Name</th><th>Gen</th><th>Parent</th><th>RSVP</th><th>Details</th></tr></thead><tbody>
        ${rows.map((r) => `<tr class="border-t align-top"><td class="p-3 font-semibold">${esc(r.full_name)}<div class="font-normal text-slate-500">${esc(r.phone || r.guardian_phone || '')}</div></td><td>${r.generation}</td><td>${esc(r.parent_name || '—')}</td><td>${badge(r.status)}</td>
        <td class="py-3 pr-3 text-slate-600">${r.status === 'YES' ? `+${r.companions_count} · ${r.arrival_date?.slice(0, 10)} ${r.arrival_time?.slice(0, 5)} → ${r.departure_date?.slice(0, 10)} · ${esc(r.travel_method)} · lodging: ${r.needs_accommodation ? 'yes' : 'no'}${r.dietary_notes ? '<br>Diet: ' + esc(r.dietary_notes) : ''}${r.special_assistance ? '<br>Assist: ' + esc(r.special_assistance) : ''}`
          : r.status === 'MAYBE' ? `Ask again ${r.followup_date?.slice(0, 10) || '—'}` : r.status === 'NO' ? `${esc(r.decline_reason)}${r.decline_text ? ' – ' + esc(r.decline_text) : ''}` : ''}</td></tr>`).join('') || '<tr><td class="p-6 text-center text-slate-400" colspan="5">No records</td></tr>'}
        </tbody></table></div>
      <button id="out" class="text-xs text-slate-500 underline">Sign out</button></div>`;
    $('#fg').onchange = $('#fs').onchange = () => renderAdmin({ generation: $('#fg').value, status: $('#fs').value });
    $('#out').onclick = () => { adminToken = ''; sessionStorage.removeItem('adminToken'); renderAdminLogin(); };
    document.querySelectorAll('[data-done]').forEach((b) => b.onclick = async () => { await api(`/admin/followups/${b.dataset.done}/done`, { method: 'POST' }); renderAdmin(filter); });
    $('#exp').onclick = async () => { const r = await api('/admin/export.csv', { raw: true }); const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'rsvps.csv'; a.click(); };
    $('#addp').onclick = async () => {
      const full_name = prompt('Parent full name'); if (!full_name) return;
      const gender = confirm('Is this parent female? (OK = Female, Cancel = Male)') ? 'Female' : 'Male';
      try { await api('/admin/parents', { method: 'POST', body: { full_name, gender } }); toast('Parent added'); renderAdmin(filter); } catch (e) { toast(e.message, true); }
    };
  } catch (e) { if (e.status === 401) { adminToken = ''; sessionStorage.removeItem('adminToken'); renderAdminLogin(); } else toast(e.message, true); }
}

/* ---------- Router ---------- */
function route() {
  const h = location.hash.slice(1) || 'CHILD';
  document.querySelectorAll('#nav a').forEach((a) => a.className = 'px-3 py-1.5 rounded-lg whitespace-nowrap ' + (a.dataset.k === h ? 'bg-green-600 text-white' : 'text-slate-300 hover:text-white'));
  h === 'admin' ? renderAdmin() : GEN[h] && renderForm(h);
}
(async () => {
  $('#nav').innerHTML = Object.entries(GEN).map(([k, g]) => `<a href="#${k}" data-k="${k}">${g.tab}</a>`).join('') + '<a href="#admin" data-k="admin">Admin</a>';
  try { OPTIONS = await api('/options'); } catch (e) { toast('Could not load options: ' + e.message, true); }
  window.addEventListener('hashchange', route); route();
})();
</script>
</body></html>
